spring.application.name=webapp

gemini.api-key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL}
gemini.max-output-tokens=${GEMINI_MAX_OUTPUT_TOKENS:1024}
app.ai.user-daily-request-limit=${AI_USER_DAILY_REQUEST_LIMIT:5}
app.ai.user-daily-token-limit=${AI_USER_DAILY_TOKEN_LIMIT:30000}
app.ai.system-daily-request-limit=${AI_SYSTEM_DAILY_REQUEST_LIMIT:18}
app.ai.system-daily-token-limit=${AI_SYSTEM_DAILY_TOKEN_LIMIT:200000}
qdrant.url=${QDRANT_URL}
qdrant.api-key=${QDRANT_API_KEY}
qdrant.collection.document-chunks=${QDRANT_COLLECTION_DOCUMENT_CHUNKS:document_chunks}
gemini.embedding-model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-2}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.data.redis.repositories.enabled=false
jwt.signerKey=${JWT_SIGNER_KEY}

server.servlet.context-path=/api/v1

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://ash-project-fe.vercel.app}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://[::1]:*}
server.tomcat.max-swallow-size=-1

# Hiển thị các câu lệnh SQL (INSERT, UPDATE...) trên màn hình console để dễ tìm lỗi
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Định dạng câu lệnh SQL in ra cho đẹp và dễ đọc
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# Cấu hình JPA tự động quản lý cấu trúc bảng
spring.jpa.hibernate.ddl-auto= validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${APP_USERNAME}
spring.mail.password=${APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_READ_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:10000}

brevo.api-key=${BREVO_API_KEY:}
app.mail.from-email=${MAIL_FROM_EMAIL:${APP_USERNAME:}}
app.mail.from-name=${MAIL_FROM_NAME:ASH Project}

# Không để trạng thái SMTP làm treo API kiểm tra sức khỏe hoặc khiến ứng dụng bị báo là không hoạt động
management.health.mail.enabled=false


app.otp.ttl-seconds=300

app.otp.resend-cooldown-seconds=60

app.otp.max-send-per-day=5

app.otp.limit-ttl-seconds=86400

app.admin.username=${ADMIN_USERNAME}
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
app.admin.fullname=${ADMIN_FULLNAME}



jwt.accessTokenDuration=${JWT_ACCESS_TOKEN_DURATION:3600}
jwt.refreshTokenDuration=${JWT_REFRESH_TOKEN_DURATION:604800}
jwt.loginAttemptLimit=${JWT_LOGIN_ATTEMPT_LIMIT:5}
jwt.loginAttemptWindowSeconds=${JWT_LOGIN_ATTEMPT_WINDOW_SECONDS:300}



spring.security.oauth2.client.registration.google.client-id=${GG_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GG_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email,openid
google.client-id=${GG_CLIENT_ID}





spring.servlet.multipart.max-file-size=100MB

spring.servlet.multipart.max-request-size=100MB

# 10485760 byte = 10 MB
app.upload.max-file-size=10485760
app.group.invite-base-url=https://ash-project-fe.vercel.app/join 

# 524288000 byte = 500 MB dung lượng cho mỗi người dùng
app.upload.max-user-storage=524288000

app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
app.cloudinary.api-key=${CLOUDINARY_API_KEY}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET}

spring.data.redis.url=${REDIS_URL}
payos.client-id=${PAYOS_CLIENT_ID}
payos.api-key=${PAYOS_API_KEY}
payos.checksum-key=${PAYOS_CHECKSUM_KEY}
